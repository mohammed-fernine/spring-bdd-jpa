name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hotelbay
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'deves.xdi.uevora.pt' }}
  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
  APP_PORT: ${{ vars.APP_PORT || '8080' }}
  DB_NAME: ${{ vars.DB_NAME || 'hotelbay' }}
  DB_USER: ${{ vars.DB_USER || 'postgres' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn clean compile -B

      - name: Run all tests
        run: mvn test -B

      - name: Package application
        run: mvn package -DskipTests -B

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-publish
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight - verify required secrets
        run: |
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "Missing DEPLOY_USER secret" && exit 1)
          test -n "${{ secrets.DEPLOY_PASSWORD }}" || (echo "Missing DEPLOY_PASSWORD secret" && exit 1)
          test -n "${{ secrets.DB_PASSWORD }}" || (echo "Missing DB_PASSWORD secret" && exit 1)

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            # Ensure docker exists and figure out sudo usage
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed on the server. Please install Docker and re-run." >&2
              exit 1
            fi
            if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi

            # Login to Docker Hub if credentials are provided (safe if public too)
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "Logging in to Docker Hub on remote host"
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | $SUDO docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || exit 1
            fi

            # Pull the latest image
            $SUDO docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Stop and remove existing containers
            $SUDO docker stop hotelbay-app hotelbay-db 2>/dev/null || true
            $SUDO docker rm hotelbay-app hotelbay-db 2>/dev/null || true

            # Create network if it doesn't exist
            $SUDO docker network create hotelbay-net 2>/dev/null || true

            # Start PostgreSQL
            $SUDO docker run -d \
              --name hotelbay-db \
              --network hotelbay-net \
              --restart unless-stopped \
              -e POSTGRES_DB=${{ env.DB_NAME }} \
              -e POSTGRES_USER=${{ env.DB_USER }} \
              -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -v pgdata:/var/lib/postgresql/data \
              postgres:16-alpine

            # Wait for database to be ready
            sleep 10

            # Start application
            $SUDO docker run -d \
              --name hotelbay-app \
              --network hotelbay-net \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://hotelbay-db:5432/${{ env.DB_NAME }} \
              -e SPRING_DATASOURCE_USERNAME=${{ env.DB_USER }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ env.DOCKER_IMAGE }}:latest
